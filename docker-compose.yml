version: "3.9"

# GreenShift — Local Development / Demonstration Docker Compose
# Runs all 5 GreenShift Agents + Dashboard

services:
  # ─── FastAPI API ──────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: greenshift/api:latest
    container_name: greenshift-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////data/greenshift.db
      - LOG_LEVEL=INFO
      - ENVIRONMENT=development
      - K8S_IN_CLUSTER=false
      - JOB_DATA_PATH=/app/data/greenshift_workloads_final.csv
      - TARIFF_HT1_PATH=/app/data/telangana_tod_tariff_ht1a.csv
      - TARIFF_HT2_PATH=/app/data/telangana_tod_tariff_ht2a.csv
      - TARIFF_INR_TO_USD=0.012
    env_file:
      - .env
    volumes:
      - greenshift-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ─── Streamlit Dashboard ──────────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    image: greenshift/dashboard:latest
    container_name: greenshift-dashboard
    ports:
      - "8501:8501"
    environment:
      - GREENSHIFT_API_URL=http://api:8000
      - DATABASE_URL=sqlite:////data/greenshift.db
      - LOG_LEVEL=INFO
      - JOB_DATA_PATH=/app/data/greenshift_workloads_final.csv
      - TARIFF_HT1_PATH=/app/data/telangana_tod_tariff_ht1a.csv
      - TARIFF_HT2_PATH=/app/data/telangana_tod_tariff_ht2a.csv
      - TARIFF_INR_TO_USD=0.012
    env_file:
      - .env
    volumes:
      - greenshift-data:/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ─── Ingest Service ───────────────────────────────────────────
  ingest:
    build:
      context: .
      dockerfile: Dockerfile.ingest
    image: greenshift/ingest:latest
    container_name: greenshift-ingest
    environment:
      - DATABASE_URL=sqlite:////data/greenshift.db
      - LOG_LEVEL=INFO
      - JOB_DATA_PATH=/app/data/greenshift_workloads_final.csv
      - TARIFF_HT1_PATH=/app/data/telangana_tod_tariff_ht1a.csv
      - TARIFF_HT2_PATH=/app/data/telangana_tod_tariff_ht2a.csv
      - TARIFF_INR_TO_USD=0.012
    env_file:
      - .env
    volumes:
      - greenshift-data:/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ─── Scheduler Service ────────────────────────────────────────
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.scheduler
    image: greenshift/scheduler:latest
    container_name: greenshift-scheduler
    environment:
      - DATABASE_URL=sqlite:////data/greenshift.db
      - LOG_LEVEL=INFO
      - JOB_DATA_PATH=/app/data/greenshift_workloads_final.csv
      - TARIFF_HT1_PATH=/app/data/telangana_tod_tariff_ht1a.csv
      - TARIFF_HT2_PATH=/app/data/telangana_tod_tariff_ht2a.csv
      - TARIFF_INR_TO_USD=0.012
    env_file:
      - .env
    volumes:
      - greenshift-data:/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ─── Dispatcher Service ───────────────────────────────────────
  dispatcher:
    build:
      context: .
      dockerfile: Dockerfile.dispatcher
    image: greenshift/dispatcher:latest
    container_name: greenshift-dispatcher
    environment:
      - DATABASE_URL=sqlite:////data/greenshift.db
      - LOG_LEVEL=INFO
      - K8S_IN_CLUSTER=false
    env_file:
      - .env
    volumes:
      - greenshift-data:/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ─── Trust / Audit Service ────────────────────────────────────
  trust:
    build:
      context: .
      dockerfile: Dockerfile.trust
    image: greenshift/trust:latest
    container_name: greenshift-trust
    environment:
      - DATABASE_URL=sqlite:////data/greenshift.db
      - LOG_LEVEL=INFO
    env_file:
      - .env
    volumes:
      - greenshift-data:/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  greenshift-data:
