# GreenShift — Local Development / Demonstration Docker Compose
# Runs all 5 GreenShift Agents + Dashboard

services:
  # ─── Redis Shared Cache (Carbon API) ─────────────────────────
  redis:
    image: redis:7-alpine
    container_name: greenshift-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ─── FastAPI API ──────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: greenshift/api:latest
    container_name: greenshift-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////data/greenshift.db
      - REDIS_URL=redis://redis:6379/0
      - CARBON_CACHE_TTL_SECONDS=900
      - LOG_LEVEL=INFO
      - ENVIRONMENT=development
      - K8S_IN_CLUSTER=false
      - JOB_DATA_PATH=/app/data/greenshift_workloads_final.csv
      - MASTER_TARIFF_DATASET=/app/data/master_tod_tariff_all_regions.csv
      - TARIFF_INR_TO_USD=0.012
    env_file:
      - .env
    volumes:
      - greenshift-data:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ─── Streamlit Dashboard ──────────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    image: greenshift/dashboard:latest
    container_name: greenshift-dashboard
    ports:
      - "8501:8501"
    environment:
      - GREENSHIFT_API_URL=http://api:8000
      - DATABASE_URL=sqlite:////data/greenshift.db
      - REDIS_URL=redis://redis:6379/0
      - CARBON_CACHE_TTL_SECONDS=900
      - LOG_LEVEL=INFO
      - JOB_DATA_PATH=/app/data/greenshift_workloads_final.csv
      - MASTER_TARIFF_DATASET=/app/data/master_tod_tariff_all_regions.csv
      - TARIFF_INR_TO_USD=0.012
    env_file:
      - .env
    volumes:
      - greenshift-data:/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ─── Ingest Service ───────────────────────────────────────────
  ingest:
    build:
      context: .
      dockerfile: Dockerfile.ingest
    image: greenshift/ingest:latest
    container_name: greenshift-ingest
    environment:
      - DATABASE_URL=sqlite:////data/greenshift.db
      - REDIS_URL=redis://redis:6379/0
      - CARBON_CACHE_TTL_SECONDS=900
      - LOG_LEVEL=INFO
      - JOB_DATA_PATH=/app/data/greenshift_workloads_final.csv
      - MASTER_TARIFF_DATASET=/app/data/master_tod_tariff_all_regions.csv
      - TARIFF_INR_TO_USD=0.012
    env_file:
      - .env
    volumes:
      - greenshift-data:/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ─── Scheduler Service ────────────────────────────────────────
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.scheduler
    image: greenshift/scheduler:latest
    container_name: greenshift-scheduler
    environment:
      - DATABASE_URL=sqlite:////data/greenshift.db
      - REDIS_URL=redis://redis:6379/0
      - CARBON_CACHE_TTL_SECONDS=900
      - LOG_LEVEL=INFO
      - JOB_DATA_PATH=/app/data/greenshift_workloads_final.csv
      - MASTER_TARIFF_DATASET=/app/data/master_tod_tariff_all_regions.csv
      - TARIFF_INR_TO_USD=0.012
    env_file:
      - .env
    volumes:
      - greenshift-data:/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ─── Dispatcher Service ───────────────────────────────────────
  dispatcher:
    build:
      context: .
      dockerfile: Dockerfile.dispatcher
    image: greenshift/dispatcher:latest
    container_name: greenshift-dispatcher
    environment:
      - DATABASE_URL=sqlite:////data/greenshift.db
      - LOG_LEVEL=INFO
      - K8S_IN_CLUSTER=false
      - K8S_NAMESPACE=greenshift
      - KUBECONFIG=/home/greenshift/.kube/config
    env_file:
      - .env
    volumes:
      - greenshift-data:/data
      - ${USERPROFILE:-~}/.kube:/home/greenshift/.kube:ro
      - ${USERPROFILE:-~}/.kube:/root/.kube:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "desktop-control-plane:host-gateway"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ─── Trust / Audit Service ────────────────────────────────────
  trust:
    build:
      context: .
      dockerfile: Dockerfile.trust
    image: greenshift/trust:latest
    container_name: greenshift-trust
    environment:
      - DATABASE_URL=sqlite:////data/greenshift.db
      - LOG_LEVEL=INFO
    env_file:
      - .env
    volumes:
      - greenshift-data:/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  greenshift-data:
