---
# GreenShift Services

apiVersion: v1
kind: Service
metadata:
  name: greenshift-api
  namespace: greenshift
  labels:
    app: greenshift
    component: api
spec:
  selector:
    app: greenshift
    component: api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  type: ClusterIP

---

# API Service Alias (Resolves http://api:8000 upstream for Nginx)
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: greenshift
  labels:
    app: greenshift
    component: api
spec:
  selector:
    app: greenshift
    component: api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  type: ClusterIP

---

# Enterprise React Control Plane Service
apiVersion: v1
kind: Service
metadata:
  name: greenshift-frontend
  namespace: greenshift
  labels:
    app: greenshift
    component: frontend
spec:
  selector:
    app: greenshift
    component: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
  type: NodePort

---

# Redis Cache Service
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: greenshift
  labels:
    app: greenshift
    component: redis
spec:
  selector:
    app: greenshift
    component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
  type: ClusterIP


---

apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: greenshift
  labels:
    app: greenshift
    component: postgres
spec:
  selector:
    app: greenshift
    component: postgres
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
