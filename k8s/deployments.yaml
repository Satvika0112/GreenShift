---
# GreenShift API Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: greenshift-api
  namespace: greenshift
  labels:
    app: greenshift
    component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: greenshift
      component: api
  template:
    metadata:
      labels:
        app: greenshift
        component: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: api
          image: greenshift/api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: greenshift-config
            - secretRef:
                name: greenshift-api-secrets
          volumeMounts:
            - name: tariff-data
              mountPath: /data/tariff
              readOnly: true
          startupProbe:
            httpGet:
              path: /live
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: tariff-data
          configMap:
            name: greenshift-tariff-data

