---
# Dashboard Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: greenshift-dashboard
  namespace: greenshift
  labels:
    app: greenshift
    component: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: greenshift
      component: dashboard
  template:
    metadata:
      labels:
        app: greenshift
        component: dashboard
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: dashboard
          image: greenshift/dashboard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8501
          envFrom:
            - configMapRef:
                name: greenshift-config
          env:
            - name: GREENSHIFT_API_URL
              value: "http://greenshift-api:8000"
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

---
# PostgreSQL Deployment (for production Kubernetes)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: greenshift
  labels:
    app: greenshift
    component: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: greenshift
      component: postgres
  template:
    metadata:
      labels:
        app: greenshift
        component: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: greenshift
            - name: POSTGRES_USER
              value: greenshift
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: greenshift-db-secrets
                  key: postgres-password
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
