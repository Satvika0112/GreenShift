---
# Dispatcher Deployment — needs the greenshift-dispatcher ServiceAccount
apiVersion: apps/v1
kind: Deployment
metadata:
  name: greenshift-dispatcher
  namespace: greenshift
  labels:
    app: greenshift
    component: dispatcher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: greenshift
      component: dispatcher
  template:
    metadata:
      labels:
        app: greenshift
        component: dispatcher
    spec:
      serviceAccountName: greenshift-dispatcher
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: dispatcher
          image: greenshift/dispatcher:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: greenshift-config
            - secretRef:
                name: greenshift-api-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"

