---
# PostgreSQL Persistent Volume Claim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: greenshift-postgres-pvc
  namespace: greenshift
  labels:
    app: greenshift
    component: postgres
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
# PostgreSQL Deployment (for production Kubernetes)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: greenshift
  labels:
    app: greenshift
    component: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: greenshift
      component: postgres
  template:
    metadata:
      labels:
        app: greenshift
        component: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: greenshift
            - name: POSTGRES_USER
              value: greenshift
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: greenshift-db-secrets
                  key: postgres-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: greenshift-postgres-pvc

---
# Redis Shared Cache Deployment (Carbon API Telemetry & Rate Limiting)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: greenshift
  labels:
    app: greenshift
    component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: greenshift
      component: redis
  template:
    metadata:
      labels:
        app: greenshift
        component: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"

---
# Enterprise React Control Plane Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: greenshift-frontend
  namespace: greenshift
  labels:
    app: greenshift
    component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: greenshift
      component: frontend
  template:
    metadata:
      labels:
        app: greenshift
        component: frontend
    spec:
      containers:
        - name: frontend
          image: greenshift/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
