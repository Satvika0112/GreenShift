apiVersion: v1
kind: ConfigMap
metadata:
  name: greenshift-config
  namespace: greenshift
  labels:
    app: greenshift
data:
  # Carbon API Base URL & Default Region
  CARBON_API_BASE_URL: "https://api.electricitymaps.com/v4"
  CARBON_REGION: "IN-SO"
  # Tariff API Base URL
  TARIFF_API_BASE_URL: "https://api.example-tariff.com/v1"
  # Application
  LOG_LEVEL: "INFO"
  ENVIRONMENT: "production"
  K8S_NAMESPACE: "greenshift"
  K8S_IN_CLUSTER: "true"
  CACHE_TTL_SECONDS: "300"
  API_PORT: "8000"
  POSTGRES_PORT: "5432"
  # Database (point to the postgres service)
  DATABASE_URL: "postgresql://greenshift:greenshift_k8s_local_2026@postgres:5432/greenshift"
  # Redis Cache & Rate Limiting
  REDIS_URL: "redis://redis:6379/0"
  # Real Indian Data Sources Paths
  JOB_DATA_PATH: "/data/jobs/greenshift_workloads_final.csv"
  MASTER_TARIFF_DATASET: "/data/tariff/master_tod_tariff_all_regions.csv"
  TARIFF_INR_TO_USD: "0.012"
  TARIFF_SEK_TO_USD: "0.095"
  TARIFF_AUD_TO_USD: "0.65"
  TARIFF_INDUSTRIAL_TYPES: "DATA_PROCESSING,ETL,HPC,BATCH,SIMULATION"
  # Notification email delivery — off by default; in-app notifications
  # always work regardless. SMTP_HOST/SMTP_USERNAME/SMTP_PASSWORD are
  # credentials and live in secrets.example.yaml, not here.
  SMTP_ENABLED: "false"
  SMTP_PORT: "587"
  SMTP_USE_TLS: "true"
  # Verified sender address for this deployment. Leave blank to fall back to
  # SMTP_USERNAME (a secret, in secrets.yaml) at send time — most providers
  # reject a From address that isn't the authenticated account or a verified
  # alias, so don't set this to a domain you don't own.
  SMTP_FROM_ADDRESS: ""
  NOTIFICATION_EMAIL_MAX_ATTEMPTS: "5"
  NOTIFICATION_POLL_INTERVAL_SECONDS: "15"
  FRONTEND_BASE_URL: "http://localhost:3000"
