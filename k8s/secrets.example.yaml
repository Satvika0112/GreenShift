# GreenShift — Kubernetes Secrets (example/template)
# Copy this file to secrets.yaml, fill in real values, then:
#   kubectl apply -f k8s/secrets.yaml
#
# !! NEVER commit the real secrets.yaml to Git !!
# Add k8s/secrets.yaml to .gitignore
#
# Generate secure values:
#   JWT_SECRET_KEY:  python -c "import secrets; print(secrets.token_hex(32))"
#   POSTGRES_PASSWORD: openssl rand -base64 24
#   INTERNAL_SERVICE_KEY: python -c "import secrets; print(secrets.token_hex(32))"

apiVersion: v1
kind: Secret
metadata:
  name: greenshift-secrets
  namespace: greenshift
  labels:
    app: greenshift
    component: api
type: Opaque
stringData:
  # ── Authentication ──────────────────────────────────────────────
  # REQUIRED: Cryptographically secure random secret (min 32 chars)
  # Generate: python -c "import secrets; print(secrets.token_hex(32))"
  JWT_SECRET_KEY: "REPLACE_WITH_CRYPTOGRAPHICALLY_SECURE_SECRET_MIN_32_CHARS"

  # ── Database ────────────────────────────────────────────────────
  # REQUIRED: Strong PostgreSQL password
  # Generate: openssl rand -base64 24
  POSTGRES_PASSWORD: "REPLACE_WITH_STRONG_DATABASE_PASSWORD"

  # Derived DATABASE_URL (update host/db name if different)
  DATABASE_URL: "postgresql+psycopg2://greenshift:REPLACE_WITH_STRONG_DATABASE_PASSWORD@greenshift-postgres:5432/greenshift"

  # ── Internal Service Key ────────────────────────────────────────
  # Optional: shared secret for internal microservice-to-microservice calls
  # Generate: python -c "import secrets; print(secrets.token_hex(32))"
  INTERNAL_SERVICE_KEY: ""

  # ── Carbon API ──────────────────────────────────────────────────
  ELECTRICITY_MAPS_API_KEY: "REPLACE_WITH_ELECTRICITY_MAPS_API_KEY"
