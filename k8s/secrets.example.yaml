# ─────────────────────────────────────────────────────────────────────────────
# GreenShift Kubernetes Secret — EXAMPLE / TEMPLATE
#
# IMPORTANT:
#   - DO NOT put real API keys in this file.
#   - DO NOT commit a filled-in copy to Git.
#   - Copy to k8s/secrets.yaml, fill in base64-encoded values, apply to cluster.
#   - k8s/secrets.yaml is in .gitignore.
#
# How to base64 encode a value:
#   Linux/Mac:  echo -n 'your-api-key' | base64
#   Windows:    [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes('your-api-key'))
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: v1
kind: Secret
metadata:
  name: greenshift-api-secrets
  namespace: greenshift
  labels:
    app: greenshift
type: Opaque
data:
  # base64-encoded values — replace with real values before applying
  ELECTRICITY_MAPS_API_KEY: ""   # echo -n 'your-key' | base64
  TARIFF_API_KEY: ""             # echo -n 'your-key' | base64
